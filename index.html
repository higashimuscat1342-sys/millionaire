 skl[k]--;su++;hm=true;if(k=='rv'||k=='jk'||k=='cpy'){S.cd[k]=1;save()}if(k!='peek')sel.clear();sortAll();render()}
function tick(){render();clearTimeout(tm);if(over||xm)return;if(turn!=0)tm=setTimeout(()=>cpu(turn),[1400,900,450,150][S.spd==null?1:S.spd])}
function clearF(){field=null;bk=false;shib=null;passes=0}
function doPlay(p,cs){
 cs=cs.slice().sort((a,b)=>a.r-b.r);
 const v=validate(cs),suits=cs.filter(c=>c.r<16).map(c=>c.s).sort();
 H[p]=H[p].filter(c=>!cs.includes(c));sel.clear();if(p==0)hm=true;
 let m=NM[p]+'：'+cs.map(lb).join(' ')+(v.t=='s'?'（階段）':'');
 sfx(p==0?'play':'play2');if(p==0){if(v.t=='s'){unlock('stair');ev('stair',100)}if(field&&field.key==16&&field.n==1&&cs.length==1&&cs[0].s==0&&cs[0].r==3){unlock('sp3');ev('sp3',150)}}
 if(R.shib&&field&&!shib&&suits.length&&field.suits.length==suits.length&&suits.every((x,i)=>x==field.suits[i])){shib=suits;m+='  しばり！'}
 field={...v,cards:cs,suits};last=p;passes=0;
 if(R.revo&&v.t=='g'&&cs.length>=4){rev=!rev;m+='  革命！';sfx('rev');flash();if(p==0){unlock('rev');ev('rev',200)}}
 if(R.eleven&&v.t=='g'&&v.r==11){bk=!bk;m+='  11バック！';sfx('rev');if(p==0){unlock('back');ev('back',100)}}
 if(R.nine&&v.t=='g'&&v.r==9){dir=-dir;m+='  9リバース！';sfx('skip')}
 if(R.ten&&v.t=='g'&&v.r==10&&H[p].length){const n=Math.min(cs.length,H[p].length);H[p].sort((a,b)=>a.r-b.r);H[p].splice(0,n);m+='  10捨て！'}
 if(R.seven&&v.t=='g'&&v.r==7&&H[p].length&&nAct()>1){const n=Math.min(cs.length,H[p].length);H[p].sort((a,b)=>a.r-b.r);const g=H[p].splice(0,n),q=nextA(p);H[q].push(...g);H[q].sort((a,b)=>a.r-b.r||a.s-b.s);m+='  7渡し！'}
 if(boss=='b1'&&p!=0&&Math.random()<.2){rev=!rev;m+='  革命将軍の号令！革命！';sfx('rev');flash()}
 const clear=R.eight&&v.t=='g'&&v.r==8,skip=R.five&&v.t=='g'&&v.r==5;
 if(clear){clearF();m+='  8切り！';sfx('cut');if(p==0){unlock('cut');ev('cut',50)}}
 if(!act(p)){out.push(p);
  if(R.foul&&(cs.some(c=>c.r==16)||(v.t=='g'&&v.r==8))){fl.add(p);m+='  反則上がり…最下位！'}else m+='  上がり！'}
 if(nAct()<=1){say(m);H.forEach((h,i)=>{if(h.length&&!out.includes(i))out.push(i)});return finish()}
 turn=clear?(act(p)?p:nextA(p)):nextA(p);
 if(skip&&!clear){turn=nextA(turn);m+='  5スキップ！';sfx('skip');if(p==0){unlock('five');ev('five',50)}}
 if(field&&turn==last&&act(last)){clearF();m+='  → 場が流れた'}
 say(m);tick()}
function doPass(p){
 sfx('pass');if(p==0)hm=true;passes++;
 const need=nAct()-(act(last)?1:0);
 if(passes>=need){clearF();turn=act(last)?last:nextA(last);say(NM[p]+'：パス → 場が流れました（'+NM[turn]+'の番）')}
 else{say(NM[p]+'：パス');turn=nextA(p)}
 tick()}
function cpu(p){
 const L=legal(H[p]);if(!L.length){if(csk[p]&&field&&H[p].length<=5&&Math.random()<.5){csk[p]=0;clearF();say(NM[p]+'：スキル「場流し」発動！');sfx('cut');turn=p;return tick()}return doPass(p)}
 const D=eD,T=TR[tr[p]||0][1];
 if(D==0){if(field&&Math.random()<.3)return doPass(p);return doPlay(p,L[Math.random()*L.length|0])}
 const cost=cs=>{const v=validate(cs),j=cs.filter(c=>c.r==16).length;
  return sr(v.key)+j*40-(field?0:cs.length*1.5)};
 L.sort((a,b)=>cost(a)-cost(b));
 let b=L[0];
 const pj=L.filter(c=>!c.some(x=>x.r==16));
 if(T=='a'&&field&&pj.length&&Math.random()<.5)b=pj.reduce((m,c)=>cost(c)>cost(m)?c:m);
 if(T=='r'&&R.revo){const rv=L.find(c=>c.length>=4&&validate(c).t=='g');if(rv)return doPlay(p,rv)}
 if(T=='c'&&field&&H[p].length>4&&(b.some(c=>c.r==16)||validate(b).key>=14))return doPass(p);
 const danger=D>=2&&H.some((h,i)=>i!=p&&act(i)&&h.length<=(D==3?3:2));
 if(danger){const nj=L.filter(c=>!c.some(x=>x.r==16)),pool=nj.length?nj:L;
  return doPlay(p,pool.reduce((m,c)=>cost(c)>cost(m)?c:m))}
 if(D==3&&R.revo){const w=H[p].reduce((s,c)=>s+sr(c.r),0)/H[p].length;
  const rv=L.find(c=>c.length>=4&&validate(c).t=='g');if(rv&&w<8)return doPlay(p,rv)}
 if(field&&b.some(c=>c.r==16)&&H[p].length>3)return doPass(p);
 doPlay(p,b)}
function finish(){over=true;
 const ord=[...out.filter(p=>!fl.has(p)),...out.filter(p=>fl.has(p))],pr=prev?prev.indexOf(0):-1;
 let fm='';const pt0=prev?prev[0]:-1;if(R.fall&&pt0>=0&&ord[0]!=pt0){ord.splice(ord.indexOf(pt0),1);ord.push(pt0);fm='<br>'+NM[pt0]+'は都落ち！'}
 const hr=ord.indexOf(0);prev=ord;const base=[1000,600,300,100][hr]+gs;
 let mw=1;if(hr==0)mw+=(evs.has('rev')?.5:0)+(evs.has('stair')?.2:0)+(evs.has('back')?.1:0);
 const sk=hr==0?Math.min(3,1+.1*S.st):1,gain=Math.round(base*mw*sk*D_PT[eD]*MM[mode]*(1+.25*S.pr)*(S.inv.purse?1.25:1)*Math.max(.7,1-.05*su));
 const bd='基本'+base+'（順位＋イベント'+gs+'）×勝利ボーナス'+mw.toFixed(1)+'×連勝'+sk.toFixed(1)+'×難易度'+D_PT[eD]+(MM[mode]!=1?'×モード'+MM[mode]:'')+(S.pr?'×転生'+(1+.25*S.pr):'')+(S.inv.purse?'×財布1.25':'')+(su?'×スキル使用'+Math.max(.7,1-.05*su).toFixed(2):'');
 S.g++;S.r[hr]++;S.pt+=gain;S.money+=gain;
 if(hr==0){S.w[eD]++;S.st++;S.best=Math.max(S.best,S.st);unlock('first');unlock('king');if(S.st>=3)unlock('win3');if(eD==3)unlock('oni');if(pr==3)unlock('rise')}else if(!(hr==1&&S.inv.guard))S.st=0;
 if(hr==0&&bet>=50000)unlock('bet');if(hr==0&&boss)unlock('boss');
 let ex='';const px='<p style="margin:4px 0;font-size:13px">';
 if(bet){const pay=hr==0?bet*2:hr==1?bet:0;S.money+=pay;ex+=px+'ベット '+$m(bet)+' → 払戻 '+$m(pay)+'</p>'}
 if(mode=='rank'){const dl=[30,10,-10,-30][hr];S.rt=Math.max(0,S.rt+dl);ex+=px+'レート '+(dl>0?'+':'')+dl+' → '+S.rt+'（'+rk()+'）</p>'}
 S.h.push(hr);if(S.h.length>30)S.h.shift();
 prog('play',1);if(hr==0){prog('win',1);if(!su)prog('noskill',1)}
 if(hr==0&&[5,10,20].includes(S.st)){S.money+=S.st*1000;ex+=px+S.st+'連勝ボーナス '+$m(S.st*1000)+'</p>'}
 if(hr==0&&boss&&!S.bs[boss]){S.bs[boss]=1;S.money+=10000;ex+=px+'ボス初撃破ボーナス $10,000</p>'}
 if(mode=='tour'){const T=S.tour;T.n++;T.p+=[3,2,1,0][hr];ex+=px+'トーナメント '+T.n+'/3戦　合計'+T.p+'pt</p>';
  if(T.n>=3){const rw=T.p>=8?30000:T.p>=6?10000:T.p>=4?3000:0;if(T.p>=8)unlock('tour');S.money+=rw;ex+=px+'トーナメント終了！報酬 '+$m(rw)+'</p>';S.tour={n:0,p:0}}}
 if(mode=='ch3'){const kk=''+dayNum();if(gain>(S.hi[kk]||0)){S.hi[kk]=gain;ex+=px+'デイリー挑戦 自己ベスト更新！</p>'}}
 if(Rsave){Object.assign(R,Rsave);Rsave=null}
 if(S.g>=50)unlock('g50');if(S.pt>=10000)unlock('pt1000');save();render();sfx(hr==0?'win':'lose');
 $('res').innerHTML='<h2 style="color:var(--gold);margin:0">結果</h2>'+ord.map((p,i)=>TT[i]+'：'+NM[p]+(fl.has(p)?'（反則上がり）':'')).join('<br>')+'<br>'+fm+'<p style="margin:6px 0;font-size:13px">難易度：'+D_NM[eD]+'　連勝：'+S.st+'</p><p style="margin:6px 0">今回スコア <b style="color:var(--gold)">'+$m(gain)+'</b> → 所持金 '+$m(S.money)+'<br><small>'+bd+'</small></p>'+ex+nw.map(x=>'<p style="margin:2px 0;color:var(--gold)">🏆 '+x+'</p>').join('');nw=[];updLv();
 setTimeout(()=>$('end').style.display='flex',700)}

 if(xm){if(cs.length==xm.n){H[0]=H[0].filter(c=>!sel.has(c.id));H[xm.to].push(...cs);sel.clear();xm=null;sortAll();say('交換完了！　'+NM[turn]+'から開始');tick()}return}

migr();daily();$('spd').value=S.spd==null?1:S.spd;$('spd').onchange=()=>{S.spd=+$('spd').value;save()};$('df').value=S.d;applyTheme();updSb();$('bm').onclick=()=>{S.bgm=S.bgm?0:1;save();updSb();bgmCtl()};$('sb').onclick=()=>{S.snd=S.snd?0:1;save();updSb();sfx('sel')};$('shp').onclick=showSp;$('rd').onclick=()=>{if(rd>0&&!hm&&!xm&&!over){sfx('sel');start(rd-1)}};
