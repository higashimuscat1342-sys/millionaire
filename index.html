function shibOK(cs){if(!shib)return true;const a=[...shib];
 for(const c of cs.filter(c=>c.r<16)){const i=a.indexOf(c.s);if(i<0)return false;a.splice(i,1)}return true}
function ok(cs){const v=validate(cs);if(!v)return false;if(!field)return true;
 if(R.sp3&&field.t=='g'&&field.key==16&&field.n==1&&cs.length==1&&cs[0].s==0&&cs[0].r==3)return true;
 return v.t==field.t&&v.n==field.n&&sr(v.key)>sr(field.key)&&shibOK(cs)}
function legal(h){const g={},J=h.filter(c=>c.r==16),P=[];
 h.forEach(c=>{if(c.r<16)(g[c.r]=g[c.r]||[]).push(c)});
 for(const r in g){const a=g[r];for(let n=1;n<=a.length;n++)for(let j=0;j<=J.length;j++){
  const cs=a.slice(0,n).concat(J.slice(0,j));if(ok(cs))P.push(cs)}}
 for(let j=1;j<=J.length;j++){const cs=J.slice(0,j);if(ok(cs))P.push(cs)}
 if(R.stair)for(let s=0;s<4;s++){const m={};h.forEach(c=>{if(c.s==s)m[c.r]=c});
  for(let lo=3;lo<=13;lo++)for(let hi=lo+2;hi<=15;hi++){let cs=[],jn=0;
   for(let r=lo;r<=hi;r++){if(m[r])cs.push(m[r]);else jn++}
   if(cs.length&&jn<=J.length){cs=cs.concat(J.slice(0,jn));if(ok(cs))P.push(cs)}}}
 return P}
const sortAll=()=>H.forEach(h=>h.sort((a,b)=>a.r-b.r||a.s-b.s));
function start(k){rd=typeof k=='number'?k:(S.inv.redo?1:0);hl=S.inv.hint?3:0;hm=false;skl={};su=0;SK.forEach(k=>{if(S.inv[k[0]])skl[k[0]]=k[2]});
 const d=[];let id=0;
 for(let s=0;s<4;s++)for(let r=3;r<=15;r++)d.push({id:id++,s,r});
 d.push({id:id++,s:4,r:16},{id:id++,s:4,r:16});
 for(let i=d.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
 H=[[],[],[],[]];d.forEach((c,i)=>H[i%4].push(c));
 if(S.inv.luck&&!H[0].some(c=>c.r==16)&&Math.random()<.5){const q=H.findIndex((h,i)=>i&&h.some(c=>c.r==16));if(q>0){const jc=H[q].find(c=>c.r==16);H[q]=H[q].filter(c=>c!==jc);H[0].sort((a,b)=>a.r-b.r);const w=H[0].shift();H[q].push(w);H[0].push(jc)}}
 field=null;last=0;passes=0;rev=false;bk=false;shib=null;out=[];fl=new Set();sel=new Set();over=false;xm=null;
 $('end').style.display='none';gs=0;evs=new Set();const mp=[['stair',R.stair,'階段を出す'],['rev',R.revo,'革命を起こす'],['back',R.eleven,'11バックを決める'],['cut',R.eight,'8切りを決める'],['five',R.five,'5スキップを決める']].filter(x=>x[1]);ms=mp.length?mp[Math.random()*mp.length|0]:null;msd=0;updLv();
 let m;
 if(R.exch&&prev){
  [[prev[3],prev[0],2],[prev[2],prev[1],1]].forEach(([lo,hi,n])=>{
   H[lo].sort((a,b)=>b.r-a.r);const g=H[lo].splice(0,n);H[hi].push(...g);
   if(hi==0)xm={n,to:lo};
   else{H[hi].sort((a,b)=>a.r-b.r);H[lo].push(...H[hi].splice(0,n))}
   if(lo==0)m='最強の'+n+'枚を渡しました：'+g.map(lb).join(' ')});
  turn=prev[3];m=(m||'カード交換')+(xm?'　渡すカードを'+xm.n+'枚選んで「渡す」':'')+'　'+NM[turn]+'から開始';
 }else{sortAll();turn=Math.max(0,H.findIndex(h=>h.some(c=>c.s==2&&c.r==3)));m=NM[turn]+'から開始（♦3の人）'}
 sortAll();say(m);tick()}
const say=m=>$('log').textContent=m;
function cardEl(c,cls=''){const e=document.createElement('div');e.dataset.cd=S.eq.cd;
 e.className='c '+(c.r==16?'j ':(c.s==1||c.s==2?'r ':''))+cls;
 e.innerHTML=c.r==16?'JOKER<i>🃏</i>':(RL[c.r]||c.r)+(c.up?'★':'')+'<i>'+SU[c.s]+'</i>';return e}
function render(){
 $('opps').innerHTML='';
 for(let p=1;p<4;p++){const e=document.createElement('div');
  e.className='opp'+(turn==p&&!over&&!xm?' on':'');
  const o=out.indexOf(p);
  e.innerHTML=NM[p]+'<div class="n">'+H[p].length+'</div>'+(o>=0?'<span class="badge">'+(fl.has(p)?'反則上がり':(o+1)+'位上がり')+'</span>':'枚');
  $('opps').appendChild(e)}
 $('me').className=(turn==0||xm)&&!over?'on':'';
 $('rev').textContent=(rev?'🔥革命中 ':'')+(bk?'⤵11バック中 ':'')+(shib?'🔒しばり：'+[...new Set(shib)].map(s=>SU[s]).join('')+' ':'');
 $('fc').innerHTML='';
 if(field)field.cards.forEach(c=>$('fc').appendChild(cardEl(c)));
 else $('fc').innerHTML='<span style="opacity:.6">場は空です</span>';
 $('hand').innerHTML='';
 H[0].forEach(c=>{const e=cardEl(c,sel.has(c.id)?'s':'');
  e.onclick=()=>{if((turn!=0&&!xm)||over)return;sfx('sel');sel.has(c.id)?sel.delete(c.id):sel.add(c.id);render()};
  $('hand').appendChild(e)});
 const cs=H[0].filter(c=>sel.has(c.id));
 $('play').textContent=xm?'渡す':'出す';
 $('play').disabled=over||!(xm?cs.length==xm.n:turn==0&&ok(cs));
 $('pass').disabled=over||!!xm||!(turn==0&&field);
 $('rd').style.display=rd>0&&!hm&&!over&&!xm?'':'none';$('ht').style.display=S.inv.hint&&!over&&!xm?'':'none';$('ht').textContent='ヒント('+hl+')';$('ht').disabled=!(turn==0&&hl>0);
 $('skb').innerHTML='';
 SK.forEach(k=>{if(!S.inv[k[0]]||over||xm)return;const b=document.createElement('button');b.className='sk';b.textContent=k[1]+'('+(skl[k[0]]||0)+')';
  b.disabled=turn!=0||!(skl[k[0]]>0)||(k[0]=='cut'&&!field)||((k[0]=='lvup'||k[0]=='jk')&&!skOk(k[0]));
  b.onclick=()=>useSk(k[0]);$('skb').appendChild(b)})}
function skOk(k){const c=H[0].filter(x=>sel.has(x.id));return c.length==1&&c[0].r>=3&&c[0].r<=(k=='lvup'?14:15)}
function info(m){$('cfm').textContent=m;$('cf').style.display='flex';$('cfn').style.display='none';$('cfy').textContent='閉じる';$('cfy').onclick=()=>{$('cf').style.display='none';$('cfn').style.display='';$('cfy').textContent='はい'}}
function useSk(k){if(turn!=0||over||xm||!(skl[k]>0))return;const c=H[0].filter(x=>sel.has(x.id));
 if(k=='lvup'){if(!skOk(k))return;c[0].r++;c[0].up=1;say('カード強化！ '+lb(c[0])+' になった');sfx('rev')}
 else if(k=='jk'){if(!skOk(k))return;c[0].r=16;c[0].s=4;c[0].up=0;say('ジョーカー化！');sfx('ach')}
 else if(k=='cut'){if(!field)return;clearF();say('場流し！もう一度あなたの番');sfx('cut')}
 else if(k=='rv'){rev=!rev;say('強制革命！強弱が'+(rev?'逆転':'元に戻った'));sfx('rev')}
 else if(k=='peek'){info([1,2,3].map(i=>NM[i]+'：'+[...H[i]].sort((a,b)=>a.r-b.r).map(lb).join(' ')).join('\n'))}
 skl[k]--;su++;hm=true;if(k!='peek')sel.clear();sortAll();render()}
function tick(){render();clearTimeout(tm);if(over||xm)return;if(turn!=0)tm=setTimeout(()=>cpu(turn),900)}
function clearF(){field=null;bk=false;shib=null;passes=0}
function doPlay(p,cs){
 cs=cs.slice().sort((a,b)=>a.r-b.r);
 const v=validate(cs),suits=cs.filter(c=>c.r<16).map(c=>c.s).sort();
 H[p]=H[p].filter(c=>!cs.includes(c));sel.clear();if(p==0)hm=true;
 let m=NM[p]+'：'+cs.map(lb).join(' ')+(v.t=='s'?'（階段）':'');
 sfx(p==0?'play':'play2');if(p==0){if(v.t=='s'){unlock('stair');ev('stair',100)}if(field&&field.key==16&&field.n==1&&cs.length==1&&cs[0].s==0&&cs[0].r==3){unlock('sp3');ev('sp3',150)}}
 if(R.shib&&field&&!shib&&suits.length&&field.suits.length==suits.length&&suits.every((x,i)=>x==field.suits[i])){shib=suits;m+='  しばり！'}
 field={...v,cards:cs,suits};last=p;passes=0;
 if(R.revo&&v.t=='g'&&cs.length>=4){rev=!rev;m+='  革命！';sfx('rev');if(p==0){unlock('rev');ev('rev',200)}}
 if(R.eleven&&v.t=='g'&&v.r==11){bk=!bk;m+='  11バック！';sfx('rev');if(p==0){unlock('back');ev('back',100)}}
 const clear=R.eight&&v.t=='g'&&v.r==8,skip=R.five&&v.t=='g'&&v.r==5;
 if(clear){clearF();m+='  8切り！';sfx('cut');if(p==0){unlock('cut');ev('cut',50)}}
 if(!act(p)){out.push(p);
  if(R.foul&&(cs.some(c=>c.r==16)||(v.t=='g'&&v.r==8))){fl.add(p);m+='  反則上がり…最下位！'}else m+='  上がり！'}
 if(nAct()<=1){say(m);H.forEach((h,i)=>{if(h.length&&!out.includes(i))out.push(i)});return finish()}
 turn=clear?(act(p)?p:nextA(p)):nextA(p);
 if(skip&&!clear){turn=nextA(turn);m+='  5スキップ！';sfx('skip');if(p==0){unlock('five');ev('five',50)}}
 if(field&&turn==last&&act(last)){clearF();m+='  → 場が流れた'}
 say(m);tick()}
function doPass(p){
 sfx('pass');if(p==0)hm=true;passes++;
 const need=nAct()-(act(last)?1:0);
 if(passes>=need){clearF();turn=act(last)?last:nextA(last);say(NM[p]+'：パス → 場が流れました（'+NM[turn]+'の番）')}
 else{say(NM[p]+'：パス');turn=nextA(p)}
 tick()}
function cpu(p){
 const L=legal(H[p]);if(!L.length)return doPass(p);
 const D=S.d;
 if(D==0){if(field&&Math.random()<.3)return doPass(p);return doPlay(p,L[Math.random()*L.length|0])}
 const cost=cs=>{const v=validate(cs),j=cs.filter(c=>c.r==16).length;
  return sr(v.key)+j*40-(field?0:cs.length*1.5)};
 L.sort((a,b)=>cost(a)-cost(b));
 let b=L[0];
 const danger=D>=2&&H.some((h,i)=>i!=p&&act(i)&&h.length<=(D==3?3:2));
 if(danger){const nj=L.filter(c=>!c.some(x=>x.r==16)),pool=nj.length?nj:L;
  return doPlay(p,pool.reduce((m,c)=>cost(c)>cost(m)?c:m))}
 if(D==3&&R.revo){const w=H[p].reduce((s,c)=>s+sr(c.r),0)/H[p].length;
  const rv=L.find(c=>c.length>=4&&validate(c).t=='g');if(rv&&w<8)return doPlay(p,rv)}
 if(field&&b.some(c=>c.r==16)&&H[p].length>3)return doPass(p);
 doPlay(p,b)}
function finish(){over=true;
 const ord=[...out.filter(p=>!fl.has(p)),...out.filter(p=>fl.has(p))],pr=prev?prev.indexOf(0):-1,hr=ord.indexOf(0);
 prev=ord;const base=[1000,600,300,100][hr]+gs;
 let mw=1;if(hr==0)mw+=(evs.has('rev')?.5:0)+(evs.has('stair')?.2:0)+(evs.has('back')?.1:0);
 const sk=hr==0?Math.min(3,1+.1*S.st):1,gain=Math.round(base*mw*sk*D_PT[S.d]*(S.inv.purse?1.25:1)*Math.max(.7,1-.05*su));
 const bd='基本'+base+'（順位＋イベント'+gs+'）×勝利ボーナス'+mw.toFixed(1)+'×連勝'+sk.toFixed(1)+'×難易度'+D_PT[S.d]+(S.inv.purse?'×財布1.25':'')+(su?'×スキル使用'+Math.max(.7,1-.05*su).toFixed(2):'');
 S.g++;S.r[hr]++;S.pt+=gain;S.money+=gain;
 if(hr==0){S.w[S.d]++;S.st++;S.best=Math.max(S.best,S.st);unlock('first');unlock('king');if(S.st>=3)unlock('win3');if(S.d==3)unlock('oni');if(pr==3)unlock('rise')}else if(!(hr==1&&S.inv.guard))S.st=0;
 if(S.g>=50)unlock('g50');if(S.pt>=10000)unlock('pt1000');save();render();sfx(hr==0?'win':'lose');
 $('res').innerHTML='<h2 style="color:var(--gold);margin:0">結果</h2>'+ord.map((p,i)=>TT[i]+'：'+NM[p]+(fl.has(p)?'（反則上がり）':'')).join('<br>')+'<br><p style="margin:6px 0;font-size:13px">難易度：'+D_NM[S.d]+'　連勝：'+S.st+'</p><p style="margin:6px 0">今回スコア <b style="color:var(--gold)">'+$m(gain)+'</b> → 所持金 '+$m(S.money)+'<br><small>'+bd+'</small></p>'+nw.map(x=>'<p style="margin:2px 0;color:var(--gold)">🏆 '+x+'</p>').join('');nw=[];updLv();
 setTimeout(()=>$('end').style.display='flex',700)}
$('play').onclick=()=>{const cs=H[0].filter(c=>sel.has(c.id));
 if(xm){if(cs.length==xm.n){H[0]=H[0].filter(c=>!sel.has(c.id));H[xm.to].push(...cs);sel.clear();xm=null;sortAll();say('交換完了！　'+NM[turn]+'から開始');tick()}return}
 if(turn==0&&ok(cs))doPlay(0,cs)};
$('pass').onclick=()=>{if(turn==0&&field)doPass(0)};
$('rl').innerHTML=RULES.map(([k,n,d])=>'<label><input type="checkbox" data-k="'+k+'" checked><b>'+n+'</b><span>'+d+'</span></label>').join('');
$('rl').onchange=e=>{R[e.target.dataset.k]=e.target.checked?1:0;if(H){field=field&&ok([])?field:field;render()}};
$('rb').onclick=()=>$('rm').style.display='flex';
$('df').value=S.d;applyTheme();updSb();$('sb').onclick=()=>{S.snd=S.snd?0:1;save();updSb();sfx('sel')};$('shp').onclick=showSp;$('rd').onclick=()=>{if(rd>0&&!hm&&!xm&&!over){sfx('sel');start(rd-1)}};
$('ht').onclick=()=>{if(turn!=0||hl<=0||over||xm)return;const L=legal(H[0]);if(!L.length)return toast('出せる手がありません。パスしましょう');
 const cst=cs=>{const v=validate(cs),j=cs.filter(c=>c.r==16).length;return sr(v.key)+j*40-(field?0:cs.length*1.5)};L.sort((a,b)=>cst(a)-cst(b));hl--;sfx('sel');
 if(field&&L[0].some(c=>c.r==16)&&H[0].length>3){toast('ヒント：パスがおすすめです');return render()}sel=new Set(L[0].map(c=>c.id));render()};$('df').onchange=()=>{S.d=+$('df').value;save()};$('kb').onclick=showRc;
start();
</script></body></html>
